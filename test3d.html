<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#1B4332}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./libs/three/three.module.min.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './libs/three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 4);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(2, 3, 4);
scene.add(dl);

window.__status = 'loading';
new GLTFLoader().load('./assets3d/body.glb', (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  window.__gltf = gltf;
  window.__status = 'loaded';
  const box = new THREE.Box3().setFromObject(model);
  window.__bbox = { min: box.min.toArray(), max: box.max.toArray() };
  renderer.render(scene, camera);
}, undefined, (err) => {
  window.__status = 'error: ' + err.message;
  console.error(err);
});

window.__renderOnce = () => renderer.render(scene, camera);
window.__scene = scene; window.__camera = camera; window.__renderer = renderer; window.__THREE = THREE;
</script>
</body></html>
